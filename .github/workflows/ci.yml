name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontends:
    name: ${{ matrix.app }} tests and build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # web is the Vue store. ops is the React back-room dashboard.
        app: [web, ops]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  api:
    name: API tests
    # MongoDB 8.0 cannot start on the newer kernel used by ubuntu-latest.
    # Revisit before GitHub retires ubuntu-22.04.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Run tests
        run: dotnet test --project SneakerStore.Api.Tests
